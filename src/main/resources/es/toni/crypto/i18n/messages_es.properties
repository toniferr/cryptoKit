# ---------------------------------------------------------------- línea de comandos
cli.help=cryptoKit {0} — cifrar, descifrar, resumir y firmar desde la línea de comandos\n\
\n\
Uso:\n\
\  cryptokit                                    abre la aplicación de escritorio\n\
\  cryptokit list                               lista los algoritmos\n\
\  cryptokit info <algoritmo>                   describe uno y sus opciones\n\
\  cryptokit keygen <algoritmo>                 imprime un par de claves PEM nuevo\n\
\  cryptokit <algoritmo> <verbo> [opciones] [texto]\n\
\n\
El texto es el último argumento, o la entrada estándar si falta o es «-». Los verbos van en inglés\n\
(encrypt, decrypt, encode, decode, hash, mac, sign, verify).\n\
Opciones: --<parámetro>=<valor> (p. ej. --key=...), --<parámetro>-format=text|hex|base64,\n\
\         --in=... y --out=... para los formatos de entrada y salida, @fichero para leer un valor de un fichero,\n\
\         --lang=en|es. Código de salida: 0 bien, 1 verificación fallida, 2 error.\n\
\n\
Ejemplos:\n\
\  cryptokit sha256 hash "hola"\n\
\  cryptokit aes-gcm encrypt --key=00112233445566778899aabbccddeeff --key-format=hex "atacad al alba"\n\
\  cryptokit argon2id hash "caballo correcto grapa batería"\n\
\  cryptokit keygen ed25519 > claves.pem\n\
\  cryptokit ed25519 sign --private=@claves.pem "te debo 10 euros"\n\
\n\
Aprende cómo funciona cada algoritmo: https://toniferr.github.io/cryptoKit/es/
