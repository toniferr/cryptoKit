# ---------------------------------------------------------------- algoritmos
alg.caesar.desc=Desplaza cada letra un número fijo de posiciones. Con solo 25 claves posibles cae en segundos probándolas todas, o con un análisis de frecuencias.
alg.vigenere.desc=El cifrado de Bellaso (1553), atribuido después a Vigenère: cada letra se desplaza según la siguiente letra de una palabra clave que se repite. Lo llamaron «le chiffre indéchiffrable» durante tres siglos, hasta que Babbage y Kasiski lo rompieron averiguando la longitud de la clave.
alg.playfair.desc=El cifrado por digramas de Wheatstone (1854): las parejas de letras se sustituyen con un cuadrado de 5×5 construido a partir de una palabra clave. Lo usaron los británicos en la guerra de los bóers y en la Primera Guerra Mundial. La salida son solo letras, por parejas; la J se convierte en I y una X separa las letras dobles.
alg.enigma.desc=Una simulación de la Enigma I del ejército alemán: tres rotores entre I–V, un reflector, la posición de los anillos, las posiciones iniciales y un clavijero, con el doble paso del rotor central. El reflector la hace su propia inversa: se descifra cifrando otra vez desde las mismas posiciones iniciales.
alg.hex.desc=Escribe cada byte como dos dígitos hexadecimales (0–9, a–f). No es cifrado: solo cambia cómo se escriben los bytes.
alg.base32.desc=Base32 (RFC 4648): 5 bits por carácter, con A–Z y 2–7, relleno con =. Se usa en los secretos TOTP y donde se pueden perder las mayúsculas. No es cifrado.
alg.base58.desc=El Base58 de Bitcoin: sin 0, O, I ni l, para poder dictarlo y copiarlo a mano; los bytes cero iniciales se convierten en unos. No es cifrado.
alg.base64.desc=Base64 (RFC 4648): 6 bits por carácter, para que datos binarios viajen por canales de solo texto (correo, JSON, claves PEM). No es cifrado.
alg.base64url.desc=Base64 con - y _ en lugar de + y /, y sin relleno, para usarlo en URL y nombres de fichero (los JWT lo usan). No es cifrado.
alg.sha256.desc=SHA-256 (NSA/NIST, 2001), de la familia SHA-2: un resumen de 256 bits. Protege los certificados TLS, las descargas de software, Git (en su formato nuevo) y la prueba de trabajo de Bitcoin. No se conoce ningún ataque práctico.
alg.sha512.desc=SHA-512: SHA-2 con palabras de 64 bits y un resumen de 512 bits. Más rápido que SHA-256 en procesadores de 64 bits.
alg.sha3-256.desc=SHA3-256 (FIPS 202, 2015): Keccak, una construcción de esponja completamente distinta de SHA-2, elegida en el concurso abierto del NIST (2007–2012) como reserva por si SHA-2 cae algún día.
alg.sha3-512.desc=SHA3-512: la esponja Keccak con un resumen de 512 bits.
alg.blake2b.desc=BLAKE2b (2012), derivado de un finalista de SHA-3: tan seguro como SHA-3 y más rápido que MD5 en software. Lo usan Argon2, WireGuard y muchas herramientas de integridad de ficheros.
alg.blake3.desc=BLAKE3 (2020): un árbol de compresiones al estilo BLAKE2, así que puede resumir en paralelo en todos los núcleos. Rapidísimo; resumen de 256 bits.
alg.ripemd160.desc=RIPEMD-160 (1996), un diseño académico europeo. Sigue sin romperse, pero sus 160 bits se quedan cortos hoy; sobrevive dentro de las direcciones de Bitcoin.
alg.sha1.desc=SHA-1 (1995). Roto: Google y el CWI fabricaron en 2017 dos PDF distintos con el mismo SHA-1 (SHAttered), y en 2020 llegaron las colisiones con prefijo elegido. No lo uses para firmas ni para integridad.
alg.md5.desc=MD5 (Rivest, 1992). Roto desde 2004: una colisión tarda segundos en un portátil, y el malware Flame falsificó con una un certificado de Microsoft en 2012. Vale como suma de control contra accidentes, nunca contra atacantes.
alg.hmac-sha256.desc=HMAC con SHA-256: un hash con una clave secreta, de modo que solo quien la conoce puede producir o comprobar la etiqueta. Prueba integridad y origen. Se usa en TLS, en los JWT (HS256) y en las API.
alg.hmac-sha512.desc=HMAC con SHA-512: una etiqueta de autenticación de 512 bits.
alg.hmac-sha3-256.desc=HMAC con SHA3-256. (SHA-3 no necesita la construcción HMAC para resistir la extensión de longitud, pero HMAC también funciona con él.)
alg.argon2id.desc=Argon2id (2015), ganador de la Password Hashing Competition y RFC 9106: lento y exigente en memoria, de modo que cada intento de un atacante le cuesta tiempo y memoria. La primera opción hoy para guardar contraseñas.
alg.scrypt.desc=scrypt (Percival, 2009): el primer hash de contraseñas exigente en memoria de uso extendido. Lo usan Litecoin y muchas herramientas de cifrado de disco. Con ln = 17 cada intento necesita 128 MiB de memoria.
alg.bcrypt.desc=bcrypt (Provos y Mazières, 1999): la lenta preparación de clave de Blowfish repetida 2^coste veces. Sigue siendo una buena opción 25 años después; solo lee los primeros 72 bytes de la contraseña, así que aquí se rechazan las más largas.
alg.pbkdf2.desc=PBKDF2 con HMAC-SHA-256 (RFC 8018): repite HMAC cientos de miles de veces. No exige memoria, así que las GPU lo atacan bien, pero está aprobado por FIPS y está en todas partes (Wi-Fi WPA2, gestores de contraseñas).
alg.aes-gcm.desc=AES en modo Galois/Counter: cifrado autenticado, el predeterminado de TLS 1.3. Cualquier cambio en el texto cifrado hace fallar el descifrado en vez de producir basura. El nonce no debe repetirse nunca con la misma clave: déjalo vacío y se genera uno aleatorio.
alg.chacha20-poly1305.desc=ChaCha20-Poly1305 (Bernstein; RFC 8439): cifrado autenticado hecho de sumas, rotaciones y XOR, rápido en móviles sin instrucciones AES. Lo usan TLS 1.3, WireGuard y SSH.
alg.aes-gcm-password.desc=Cifrar con contraseña, a la manera moderna: Argon2id convierte la contraseña y una sal aleatoria en una clave de 256 bits, y AES-256-GCM cifra y autentica. La salida lleva todo lo necesario para descifrar salvo la contraseña.
alg.aes-ctr.desc=AES en modo contador: AES cifra un contador para generar un flujo de clave que se combina con XOR con el mensaje. Rápido y paralelizable, pero sin integridad: un atacante puede invertir bits del texto en claro. Mejor AES-GCM.
alg.aes-cbc.desc=AES en modo de encadenamiento de bloques: cada bloque se combina con XOR con el bloque cifrado anterior antes de cifrarlo. Muy usado durante décadas, pero sin autenticación y expuesto a ataques de oráculo de relleno. Mejor AES-GCM. Compatible con cryptoKit 1.0.
alg.aes-ecb.desc=AES en modo libro de códigos: cada bloque de 16 bytes se cifra por separado, así que bloques iguales dan texto cifrado igual y se transparentan los patrones (el «pingüino ECB»). Nunca para datos reales. Compatible con cryptoKit 1.0.
alg.3des-cbc.desc=Triple DES (EDE): DES tres veces con dos o tres claves, un apaño de los noventa. Su bloque de 64 bits lo hace vulnerable a Sweet32 tras unas decenas de gigabytes; el NIST lo prohibió para cifrar a partir de 2023.
alg.blowfish-cbc.desc=Blowfish (Schneier, 1993) en modo CBC: una alternativa rápida y libre a DES. Su bloque de 64 bits es demasiado pequeño para grandes volúmenes de datos (Sweet32). Compatible con cryptoKit 1.0.
alg.blowfish-ecb.desc=Blowfish en modo ECB: bloques iguales dan texto cifrado igual. Compatible con cryptoKit 1.0.
alg.des-cbc.desc=DES (IBM/NBS, 1977) en modo CBC. Su clave de 56 bits se rompió por fuerza bruta en 22 horas en 1999 (Deep Crack y distributed.net); hoy cuesta minutos. Solo para leer datos antiguos. Compatible con cryptoKit 1.0.
alg.des-ecb.desc=DES en modo ECB: un cifrado roto en un modo que filtra patrones. Solo para leer datos antiguos. Compatible con cryptoKit 1.0.
alg.pbe-jasypt.desc=AES-256 con contraseña tal como lo hacía cryptoKit 1.0 con Jasypt (PBEWithHMACSHA512AndAES_256, 1.000 iteraciones, sal e IV aleatorios, Base64). Se mantiene para que los textos antiguos se puedan descifrar; para datos nuevos usa AES-GCM + Argon2id. Solo contraseñas ASCII.
alg.ml-kem-768.desc=Poscuántico: ML-KEM-768 (FIPS 203, 2024, antes Kyber) es un encapsulado de claves basado en retículos que no se sabe romper con ordenadores cuánticos. Envuelve una clave nueva para AES-256-GCM, que cifra el mensaje. Genera primero un par de claves.
alg.x25519-aes-gcm.desc=Cifrado híbrido con curvas elípticas (estilo ECIES): un acuerdo X25519 nuevo con la clave pública del destinatario deriva una clave AES-256-GCM para cada mensaje. Claves pequeñas (32 bytes) y rápido. Genera primero un par de claves.
alg.rsa-oaep.desc=RSA (1977) con relleno OAEP y SHA-256, claves de 3072 bits. El primer cifrado de clave pública; cifra solo unos cientos de bytes, así que en la práctica envuelve claves simétricas. Un ordenador cuántico grande con el algoritmo de Shor lo rompería. Genera primero un par de claves.
alg.ml-dsa-65.desc=Firmas poscuánticas: ML-DSA-65 (FIPS 204, 2024, antes Dilithium), basadas en retículos. Claves y firmas mucho mayores que las de Ed25519 (una firma de 3.309 bytes), pero deberían resistir a los ordenadores cuánticos. Genera primero un par de claves.
alg.ed25519.desc=Ed25519 (Bernstein, Duif, Lange, Schwabe y Yang, 2011): firmas rápidas con curvas elípticas, claves de 32 bytes y firmas de 64. Deterministas: no hay un nonce aleatorio que pueda salir mal. Lo usan SSH, Signal y Git. Genera primero un par de claves.
alg.ecdsa-p256.desc=ECDSA sobre la curva P-256 del NIST con SHA-256: la firma de los certificados TLS, las passkeys y muchas tarjetas inteligentes. Cada firma necesita un nonce aleatorio nuevo; repetirlo filtra la clave privada (como aprendió Sony con la PS3 en 2010). Genera primero un par de claves.
alg.rsa-pss.desc=Firmas RSA con el relleno probabilístico PSS (Bellare y Rogaway), SHA-256 y claves de 3072 bits. Genera primero un par de claves.

