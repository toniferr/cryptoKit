# ---------------------------------------------------------------- command line
cli.help=cryptoKit {0} — encrypt, decrypt, hash and sign from the command line\n\
\n\
Usage:\n\
\  cryptokit                                    open the desktop app\n\
\  cryptokit list                               list the algorithms\n\
\  cryptokit info <algorithm>                   describe one and its options\n\
\  cryptokit keygen <algorithm>                 print a new PEM key pair\n\
\  cryptokit <algorithm> <verb> [options] [text]\n\
\n\
The text comes from the last argument, or from standard input if it is missing or “-”.\n\
Options: --<parameter>=<value> (e.g. --key=...), --<parameter>-format=text|hex|base64,\n\
\         --in=... and --out=... for the input and output formats, @file to read a value from a file,\n\
\         --lang=en|es. Exit status: 0 ok, 1 verification failed, 2 error.\n\
\n\
Examples:\n\
\  cryptokit sha256 hash "hello"\n\
\  cryptokit aes-gcm encrypt --key=00112233445566778899aabbccddeeff --key-format=hex "attack at dawn"\n\
\  cryptokit argon2id hash "correct horse battery staple"\n\
\  cryptokit keygen ed25519 > keys.pem\n\
\  cryptokit ed25519 sign --private=@keys.pem "I owe you 10 euros"\n\
\n\
Learn how each algorithm works: https://toniferr.github.io/cryptoKit/
