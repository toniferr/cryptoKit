# ---------------------------------------------------------------- algorithms
alg.caesar.desc=Shifts every letter a fixed number of places. With only 25 possible keys it falls to a brute-force search in seconds, or to frequency analysis.
alg.vigenere.desc=Bellaso's cipher (1553), later named after Vigenère: each letter is shifted by the next letter of a repeating keyword. Called “le chiffre indéchiffrable” for three centuries, until Babbage and Kasiski broke it by finding the keyword's length.
alg.playfair.desc=Wheatstone's digraph cipher (1854): pairs of letters are replaced using a 5×5 square built from a keyword. Used by the British in the Boer War and the First World War. Output is letters only, in pairs; J becomes I and an X splits doubled letters.
alg.enigma.desc=A simulation of the German Army's Enigma I: three rotors from I–V, a reflector, ring settings, start positions and a plugboard, with the middle rotor's double step. The reflector makes it its own inverse: decrypt by encrypting again from the same start positions.
alg.hex.desc=Writes each byte as two hexadecimal digits (0–9, a–f). Not encryption: it only changes how bytes are written.
alg.base32.desc=RFC 4648 Base32: 5 bits per character from A–Z and 2–7, padded with =. Used in TOTP secrets and where case may be lost. Not encryption.
alg.base58.desc=Bitcoin's Base58: no 0, O, I or l, so it can be read aloud and copied by hand; leading zero bytes become 1s. Not encryption.
alg.base64.desc=RFC 4648 Base64: 6 bits per character, so binary data can travel through text-only channels (e-mail, JSON, PEM keys). Not encryption.
alg.base64url.desc=Base64 with - and _ instead of + and /, and without padding, so it is safe in URLs and file names (JWTs use it). Not encryption.
alg.sha256.desc=SHA-256 (NSA/NIST, 2001), from the SHA-2 family: a 256-bit digest. It secures TLS certificates, software downloads, Git (in its new format) and Bitcoin's proof of work. No practical attack is known.
alg.sha512.desc=SHA-512: SHA-2 with 64-bit words and a 512-bit digest. Faster than SHA-256 on 64-bit processors.
alg.sha3-256.desc=SHA3-256 (FIPS 202, 2015): Keccak, a sponge construction completely different from SHA-2, chosen by NIST's open competition (2007–2012) as a backup in case SHA-2 ever falls.
alg.sha3-512.desc=SHA3-512: the Keccak sponge with a 512-bit digest.
alg.blake2b.desc=BLAKE2b (2012), derived from a SHA-3 finalist: as secure as SHA-3 and faster than MD5 in software. Used by Argon2, WireGuard and many file-integrity tools.
alg.blake3.desc=BLAKE3 (2020): a tree of BLAKE2-style compressions, so it can hash in parallel on every core. Extremely fast; 256-bit digest.
alg.ripemd160.desc=RIPEMD-160 (1996), an academic European design. Still unbroken, but its 160-bit output is short by today's standards; it survives inside Bitcoin addresses.
alg.sha1.desc=SHA-1 (1995). Broken: Google and CWI produced two different PDFs with the same SHA-1 in 2017 (SHAttered), and chosen-prefix collisions followed in 2020. Do not use it for signatures or integrity.
alg.md5.desc=MD5 (Rivest, 1992). Broken since 2004: collisions take seconds on a laptop, and the Flame malware forged a Microsoft certificate with one in 2012. Fine as a checksum against accidents, never against attackers.
alg.hmac-sha256.desc=HMAC with SHA-256: a hash keyed with a secret, so only someone who knows the key can produce or check the tag. Proves integrity and origin. Used in TLS, JWTs (HS256) and APIs.
alg.hmac-sha512.desc=HMAC with SHA-512: a 512-bit authentication tag.
alg.hmac-sha3-256.desc=HMAC with SHA3-256. (SHA-3 does not need HMAC's construction to resist length extension, but HMAC works with it too.)
alg.argon2id.desc=Argon2id (2015), winner of the Password Hashing Competition and RFC 9106: slow and memory-hard, so every guess an attacker makes costs time and memory. The first choice for storing passwords today.
alg.scrypt.desc=scrypt (Percival, 2009): the first widely used memory-hard password hash. Litecoin and many disk-encryption tools use it. With ln = 17 each guess needs 128 MiB of memory.
alg.bcrypt.desc=bcrypt (Provos and Mazières, 1999): Blowfish's slow key setup repeated 2^cost times. Still a good choice after 25 years; it only reads the first 72 bytes of a password, so longer ones are rejected here.
alg.pbkdf2.desc=PBKDF2 with HMAC-SHA-256 (RFC 8018): iterates HMAC hundreds of thousands of times. Not memory-hard, so GPUs attack it well, but it is FIPS-approved and everywhere (Wi-Fi WPA2, password managers).
alg.aes-gcm.desc=AES in Galois/Counter Mode: authenticated encryption, the default of TLS 1.3. Any change to the ciphertext makes decryption fail instead of producing garbage. The nonce must never repeat under the same key: leave it empty and a random one is generated.
alg.chacha20-poly1305.desc=ChaCha20-Poly1305 (Bernstein; RFC 8439): authenticated encryption built from additions, rotations and XORs, fast on phones without AES instructions. Used by TLS 1.3, WireGuard and SSH.
alg.aes-gcm-password.desc=Encrypt with a password, the modern way: Argon2id turns the password and a random salt into a 256-bit key and AES-256-GCM encrypts and authenticates. The output carries everything needed to decrypt except the password.
alg.aes-ctr.desc=AES in counter mode: AES encrypts a counter to make a key stream, XORed with the message. Fast and parallel, but with no integrity: an attacker can flip bits of the plaintext. Prefer AES-GCM.
alg.aes-cbc.desc=AES in cipher-block chaining mode: each block is XORed with the previous ciphertext block before encryption. Widely used for decades, but unauthenticated and prone to padding-oracle attacks. Prefer AES-GCM. Compatible with cryptoKit 1.0.
alg.aes-ecb.desc=AES in electronic codebook mode: every 16-byte block is encrypted on its own, so equal blocks give equal ciphertext and patterns show through (the “ECB penguin”). Never use it for real data. Compatible with cryptoKit 1.0.
alg.3des-cbc.desc=Triple DES (EDE): DES three times with two or three keys, a stopgap of the 1990s. Its 64-bit block makes it vulnerable to Sweet32 after a few dozen gigabytes; NIST disallowed it for encryption after 2023.
alg.blowfish-cbc.desc=Blowfish (Schneier, 1993) in CBC mode: a fast, free alternative to DES. Its 64-bit block is too small for large amounts of data (Sweet32). Compatible with cryptoKit 1.0.
alg.blowfish-ecb.desc=Blowfish in ECB mode: equal blocks give equal ciphertext. Compatible with cryptoKit 1.0.
alg.des-cbc.desc=DES (IBM/NBS, 1977) in CBC mode. Its 56-bit key was brute-forced in 22 hours in 1999 (Deep Crack and distributed.net); today it takes minutes. Here only to read old data. Compatible with cryptoKit 1.0.
alg.des-ecb.desc=DES in ECB mode: a broken cipher in a leaky mode. Here only to read old data. Compatible with cryptoKit 1.0.
alg.pbe-jasypt.desc=Password-based AES-256 as cryptoKit 1.0 did it with Jasypt (PBEWithHMACSHA512AndAES_256, 1,000 iterations, random salt and IV, Base64). Kept so old ciphertexts still decrypt; for new data use AES-GCM + Argon2id. ASCII passwords only.
alg.ml-kem-768.desc=Post-quantum: ML-KEM-768 (FIPS 203, 2024, formerly Kyber) is a lattice-based key encapsulation that quantum computers are not known to break. It wraps a fresh key for AES-256-GCM, which encrypts the message. Generate a key pair first.
alg.x25519-aes-gcm.desc=Elliptic-curve hybrid encryption (ECIES style): a fresh X25519 key agreement with the recipient's public key derives an AES-256-GCM key for each message. Small keys (32 bytes) and fast. Generate a key pair first.
alg.rsa-oaep.desc=RSA (1977) with OAEP padding and SHA-256, 3072-bit keys. The first public-key cipher; it encrypts only a few hundred bytes, so in practice it wraps symmetric keys. A large quantum computer running Shor's algorithm would break it. Generate a key pair first.
alg.ml-dsa-65.desc=Post-quantum signatures: ML-DSA-65 (FIPS 204, 2024, formerly Dilithium), based on lattices. Keys and signatures are much larger than Ed25519's (a 3,309-byte signature) but should survive quantum computers. Generate a key pair first.
alg.ed25519.desc=Ed25519 (Bernstein, Duif, Lange, Schwabe and Yang, 2011): fast elliptic-curve signatures with 32-byte keys and 64-byte signatures. Deterministic, so there is no random nonce to get wrong. Used by SSH, Signal and Git. Generate a key pair first.
alg.ecdsa-p256.desc=ECDSA over NIST P-256 with SHA-256: the signature of TLS certificates, passkeys and many smart cards. Each signature needs a fresh random nonce; reusing one leaks the private key (as Sony learned with the PS3 in 2010). Generate a key pair first.
alg.rsa-pss.desc=RSA signatures with the probabilistic PSS padding (Bellare and Rogaway), SHA-256 and 3072-bit keys. Generate a key pair first.

# ---------------------------------------------------------------- notes shown after an operation
note.notText=The result is not valid text, so it is shown in hexadecimal.
note.digest.bits={0}-bit digest. Change one character of the input and about half of these bits flip.
note.key.short=The key is only {0} bytes long: use at least 16 random bytes (the dice makes 32).
note.password.salt=A random salt is stored inside the result, so hashing the same password twice gives different strings. Use Verify to check a password.
note.ecb=ECB mode: identical 16-byte blocks of plaintext give identical ciphertext blocks.
note.iv.prepended=A random {0}-byte IV was generated and written in front of the ciphertext: {1}. Decrypt with the IV field empty.
note.ctr.reuse=Never reuse a key and IV pair in CTR mode: two messages encrypted with the same pair reveal their XOR.
note.nonce.prepended=A random 12-byte nonce was generated and written in front of the ciphertext: {0}. Decrypt with the nonce field empty.
note.nonce.reuse=You chose the nonce: never use it again with this key.
note.aead.tag=The last 16 bytes are the authentication tag.
note.aead.ok=The authentication tag checked out: the ciphertext was not modified.
note.password.aead=Format: version 1 | 16-byte salt | 12-byte nonce | ciphertext and tag. Argon2id: 19 MiB, 2 passes.
note.pbe.legacy=Legacy format (cryptoKit 1.0 / Jasypt): 16-byte salt | 16-byte IV | ciphertext, 1,000 iterations.
note.rsa.random=OAEP is randomised: encrypting the same text twice gives different ciphertexts.
note.ecies=Format: 32-byte ephemeral public key | 12-byte nonce | ciphertext and tag.
note.mlkem=Format: {0}-byte ML-KEM encapsulation | 12-byte nonce | ciphertext and tag.
note.signature.size=The signature is {0} bytes long.
note.playfair.square=Square: {0}
note.enigma.window=Rotor windows at the end: {0}. To decrypt, set the start positions back and run it again.

